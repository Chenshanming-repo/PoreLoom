[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "poreloom"
version = "0.1.0"
description = "PoreLoom: streaming adaptive-sampling control on raw nanopore signal"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "torch>=1.12",
]

[project.optional-dependencies]
raw = ["pyslow5"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
